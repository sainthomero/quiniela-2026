<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiniela Mundial 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --verde:   #00A86B;
  --verde-d: #007A4E;
  --rojo:    #D0393B;
  --oro:     #F0A500;
  --plata:   #9BA3AF;
  --bronce:  #C07840;
  --bg:      #0C0E12;
  --bg2:     #141820;
  --bg3:     #1C2230;
  --borde:   rgba(255,255,255,0.07);
  --texto:   #F0F2F5;
  --muted:   #7A8494;
  --font-d:  'Bebas Neue', sans-serif;
  --font-b:  'DM Sans', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--texto);font-family:var(--font-b);font-size:14px;line-height:1.5;min-height:100vh}

/* ── Header ── */
.site-header{
  background:linear-gradient(160deg,#0a3d20 0%,#0C0E12 60%);
  border-bottom:1px solid var(--borde);
  padding:2.5rem 1.5rem 2rem;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.site-header::before{
  content:'';position:absolute;inset:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%2300A86B' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  pointer-events:none;
}
.badge-fase{
  display:inline-block;background:rgba(0,168,107,0.15);
  border:1px solid rgba(0,168,107,0.3);color:var(--verde);
  font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  padding:4px 14px;border-radius:20px;margin-bottom:1rem;
}
.site-header h1{
  font-family:var(--font-d);font-size:clamp(2.5rem,8vw,4.5rem);
  letter-spacing:.04em;line-height:1;color:#fff;
  text-shadow:0 0 60px rgba(0,168,107,0.3);
  margin-bottom:.25rem;
}
.site-header .sub{
  font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;
}

/* ── Nav ── */
nav{
  display:flex;justify-content:center;gap:4px;
  padding:.75rem 1rem;background:var(--bg2);
  border-bottom:1px solid var(--borde);
  position:sticky;top:0;z-index:100;
}
.nav-btn{
  padding:6px 18px;font-size:12px;font-weight:500;letter-spacing:.04em;
  border:1px solid transparent;border-radius:6px;cursor:pointer;
  background:transparent;color:var(--muted);transition:all .2s;font-family:var(--font-b);
  text-transform:uppercase;
}
.nav-btn:hover{color:var(--texto);background:var(--bg3)}
.nav-btn.active{background:var(--verde);color:#fff;border-color:var(--verde-d)}

/* ── Layout ── */
main{max-width:960px;margin:0 auto;padding:2rem 1rem}
.page{display:none}.page.active{display:block}

/* ── Stat cards ── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:2rem}
.stat-card{background:var(--bg2);border:1px solid var(--borde);border-radius:12px;padding:1.25rem;text-align:center}
.stat-card .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.stat-card .value{font-family:var(--font-d);font-size:2rem;letter-spacing:.03em;color:var(--texto)}
.stat-card .value.verde{color:var(--verde)}

/* ── Ranking ── */
.section-title{
  font-family:var(--font-d);font-size:1.6rem;letter-spacing:.05em;
  margin-bottom:1.25rem;color:var(--texto);display:flex;align-items:center;gap:10px;
}
.section-title::after{content:'';flex:1;height:1px;background:var(--borde)}

.ranking-list{display:flex;flex-direction:column;gap:8px;margin-bottom:2rem}
.rank-item{
  display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;
  background:var(--bg2);border:1px solid var(--borde);border-radius:10px;
  padding:14px 16px;transition:border-color .2s;
}
.rank-item:hover{border-color:rgba(255,255,255,0.15)}
.rank-item.pos-1{border-color:rgba(240,165,0,0.3);background:rgba(240,165,0,0.05)}
.rank-item.pos-2{border-color:rgba(155,163,175,0.3)}
.rank-item.pos-3{border-color:rgba(192,120,64,0.3)}

.rank-pos{
  width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-d);font-size:1.2rem;flex-shrink:0;
}
.pos-1 .rank-pos{background:rgba(240,165,0,0.15);color:var(--oro)}
.pos-2 .rank-pos{background:rgba(155,163,175,0.1);color:var(--plata)}
.pos-3 .rank-pos{background:rgba(192,120,64,0.1);color:var(--bronce)}
.rank-item:not(.pos-1):not(.pos-2):not(.pos-3) .rank-pos{background:var(--bg3);color:var(--muted)}

.rank-name{font-weight:500;font-size:15px;margin-bottom:3px}
.rank-breakdown{font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.rank-breakdown span{display:flex;align-items:center;gap:3px}
.rank-pts{text-align:right}
.rank-pts .pts-num{font-family:var(--font-d);font-size:1.8rem;color:var(--verde);line-height:1}
.rank-pts .pts-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* ── Resultados ── */
.results-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:2rem}
.match-card{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  background:var(--bg2);border:1px solid var(--borde);border-radius:10px;padding:12px 16px;
}
.match-team{font-weight:500;font-size:13px}
.match-team.home{text-align:right}
.match-team.away{text-align:left}
.match-score{
  display:flex;align-items:center;gap:6px;
  background:var(--bg3);border-radius:8px;padding:6px 14px;min-width:70px;justify-content:center;
}
.score-num{font-family:var(--font-d);font-size:1.5rem;line-height:1}
.score-sep{color:var(--muted);font-size:13px}
.match-fase{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.match-card-wrap .fase-hdr{
  font-family:var(--font-d);font-size:1rem;letter-spacing:.06em;
  color:var(--verde);padding:1rem 0 .4rem;text-transform:uppercase;
}

/* ── Tabla pronósticos ── */
.table-wrap{overflow-x:auto;margin-bottom:2rem}
.pron-table{width:100%;border-collapse:collapse;min-width:600px}
.pron-table th{
  background:var(--bg3);color:var(--muted);font-size:11px;font-weight:500;
  text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;
  border-bottom:1px solid var(--borde);text-align:center;white-space:nowrap;
}
.pron-table th.partido{text-align:left;min-width:180px}
.pron-table td{
  padding:8px 12px;border-bottom:1px solid var(--borde);
  font-size:12px;text-align:center;vertical-align:middle;
}
.pron-table td.partido-cell{text-align:left}
.pron-table td .equipos{font-weight:500}
.pron-table td .fase-tag{font-size:10px;color:var(--muted)}
.pron-table .grupo-hdr td{
  background:rgba(0,168,107,0.08);color:var(--verde);
  font-size:11px;font-weight:600;letter-spacing:.06em;padding:5px 12px;
}
.pts-badge{
  display:inline-block;background:rgba(0,168,107,0.15);color:var(--verde);
  font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;
}
.score-disp{font-family:var(--font-d);font-size:1rem;letter-spacing:.04em}
.score-real{color:var(--oro)}
.score-pred{color:var(--muted)}
.hit-3{color:var(--verde)} .hit-1{color:#60a8e8}

/* ── Vacío ── */
.empty{text-align:center;padding:3rem;color:var(--muted);font-size:13px}
.empty .icon{font-size:2.5rem;margin-bottom:.5rem;opacity:.4}

/* ── Footer ── */
footer{text-align:center;padding:2rem;color:var(--muted);font-size:12px;border-top:1px solid var(--borde)}

/* ── Responsive ── */
@media(max-width:600px){
  .rank-breakdown{display:none}
  .match-team{font-size:12px}
  nav{gap:2px}.nav-btn{padding:5px 10px;font-size:11px}
}

/* ── Animación entrada ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rank-item,.match-card,.stat-card{animation:fadeUp .3s ease both}
.rank-item:nth-child(1){animation-delay:.05s}
.rank-item:nth-child(2){animation-delay:.10s}
.rank-item:nth-child(3){animation-delay:.15s}
.rank-item:nth-child(4){animation-delay:.20s}
.rank-item:nth-child(5){animation-delay:.25s}
</style>
</head>
<body>

<header class="site-header">
  <div class="badge-fase" id="badge-fase">Cargando...</div>
  <h1>Quiniela 2026</h1>
  <p class="sub">USA &middot; Canadá &middot; México &nbsp;|&nbsp; 11 Jun – 19 Jul 2026</p>
</header>

<nav>
  <button class="nav-btn active" onclick="showPage('ranking',this)">Ranking</button>
  <button class="nav-btn" onclick="showPage('resultados',this)">Resultados</button>
  <button class="nav-btn" onclick="showPage('pronosticos',this)">Pronósticos</button>
</nav>

<main>
  <!-- ── RANKING ── -->
  <div id="page-ranking" class="page active">
    <div class="stats-row" id="stats-row"></div>
    <div class="section-title">Tabla de posiciones</div>
    <div class="ranking-list" id="ranking-list"></div>
  </div>

  <!-- ── RESULTADOS ── -->
  <div id="page-resultados" class="page">
    <div class="section-title">Resultados</div>
    <div class="match-card-wrap" id="resultados-wrap"></div>
  </div>

  <!-- ── PRONÓSTICOS ── -->
  <div id="page-pronosticos" class="page">
    <div class="section-title">Pronósticos por partido</div>
    <p style="color:var(--muted);font-size:13px;margin-bottom:1.25rem">
      Marcador pronosticado de cada participante vs el resultado real.
      <span class="hit-3">■</span> 3 pts &nbsp;
      <span class="hit-1">■</span> 1 pt goles &nbsp;
      <span style="color:var(--oro)">■</span> resultado real
    </p>
    <div class="table-wrap"><table class="pron-table" id="pron-table"></table></div>
  </div>
</main>

<footer>Quiniela Mundial 2026 &mdash; Actualizado por el organizador</footer>

<script src="datos.js"></script>
<script>
function showPage(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  if (btn) btn.classList.add('active');
  if (id === 'pronosticos') renderPronosticos();
}

function calcTotal(p) {
  return (p.partidos || 0) + (p.grupos || 0) + (p.avances || 0) + (p.especiales || 0);
}

function renderRanking() {
  const d = DATOS;
  document.getElementById('badge-fase').textContent = d.faseActual || 'Previo al torneo';

  const sorted = [...d.participantes].sort((a, b) => calcTotal(b) - calcTotal(a));

  // Stats
  const played = d.resultados.length;
  const leader = sorted[0];
  document.getElementById('stats-row').innerHTML = `
    <div class="stat-card"><div class="label">Participantes</div><div class="value">${d.participantes.length}</div></div>
    <div class="stat-card"><div class="label">Partidos jugados</div><div class="value">${played}</div></div>
    <div class="stat-card"><div class="label">Líder</div><div class="value" style="font-size:1.3rem">${leader ? leader.nombre : '—'}</div></div>
    <div class="stat-card"><div class="label">Puntos del líder</div><div class="value verde">${leader ? calcTotal(leader) : 0}</div></div>
  `;

  if (!sorted.length) {
    document.getElementById('ranking-list').innerHTML = '<div class="empty"><div class="icon">🏆</div>El torneo aún no ha comenzado.<br>El ranking aparecerá aquí cuando se ingresen los datos.</div>';
    return;
  }

  const posClass = ['pos-1','pos-2','pos-3'];
  const medals = ['🥇','🥈','🥉'];
  document.getElementById('ranking-list').innerHTML = sorted.map((p, i) => {
    const total = calcTotal(p);
    const cls = posClass[i] || '';
    const pos = i < 3 ? medals[i] : (i + 1);
    return `<div class="rank-item ${cls}">
      <div class="rank-pos">${pos}</div>
      <div>
        <div class="rank-name">${p.nombre}</div>
        <div class="rank-breakdown">
          <span>⚽ Partidos: <b>${p.partidos || 0}</b></span>
          <span>📊 Grupos: <b>${p.grupos || 0}</b></span>
          <span>➡️ Avances: <b>${p.avances || 0}</b></span>
          <span>⭐ Especiales: <b>${p.especiales || 0}</b></span>
        </div>
      </div>
      <div class="rank-pts">
        <div class="pts-num">${total}</div>
        <div class="pts-lbl">puntos</div>
      </div>
    </div>`;
  }).join('');
}

function renderResultados() {
  const res = DATOS.resultados;
  if (!res.length) {
    document.getElementById('resultados-wrap').innerHTML = '<div class="empty"><div class="icon">⚽</div>Aún no hay partidos jugados.</div>';
    return;
  }
  // Agrupar por fase
  const fases = {};
  res.forEach(r => {
    if (!fases[r.fase]) fases[r.fase] = [];
    fases[r.fase].push(r);
  });
  let html = '';
  Object.entries(fases).forEach(([fase, partidos]) => {
    html += `<div class="fase-hdr">${fase}</div>`;
    partidos.forEach(m => {
      html += `<div class="match-card">
        <div class="match-team home">${m.local}</div>
        <div class="match-score">
          <span class="score-num">${m.gl}</span>
          <span class="score-sep">-</span>
          <span class="score-num">${m.gv}</span>
        </div>
        <div class="match-team away">${m.visitante}</div>
      </div>`;
    });
  });
  document.getElementById('resultados-wrap').innerHTML = html;
}

function renderPronosticos() {
  const res = DATOS.resultados;
  const parts = DATOS.participantes;
  if (!res.length || !parts.length) {
    document.getElementById('pron-table').innerHTML = '<tr><td class="empty" colspan="20">No hay datos aún.</td></tr>';
    return;
  }
  const heads = `<thead><tr>
    <th class="partido">Partido</th>
    <th class="partido">Resultado</th>
    ${parts.map(p => `<th>${p.nombre}</th>`).join('')}
  </tr></thead>`;

  // Agrupamos por fase
  const fases = {};
  res.forEach(r => { if (!fases[r.fase]) fases[r.fase] = []; fases[r.fase].push(r); });

  let rows = '';
  Object.entries(fases).forEach(([fase, partidos]) => {
    rows += `<tr class="grupo-hdr"><td colspan="${2 + parts.length}">${fase}</td></tr>`;
    partidos.forEach(m => {
      const realH = m.gl, realA = m.gv;
      const realWin = realH > realA ? 'h' : realH < realA ? 'a' : 'd';
      rows += `<tr>
        <td class="partido-cell">
          <div class="equipos">${m.local} vs ${m.visitante}</div>
        </td>
        <td><span class="score-disp score-real">${realH} - ${realA}</span></td>
        ${parts.map(p => {
          // Si el participante tiene pronóstico para este partido
          const pred = p.pronosticos && p.pronosticos[`${m.local}-${m.visitante}`];
          if (!pred) return `<td><span style="color:var(--muted)">—</span></td>`;
          const pH = pred[0], pA = pred[1];
          const predWin = pH > pA ? 'h' : pH < pA ? 'a' : 'd';
          let pts = 0;
          if (predWin === realWin) pts += 3;
          if (pH === realH) pts += 1;
          if (pA === realA) pts += 1;
          const cls = pts === 5 ? 'hit-3' : pts >= 3 ? 'hit-3' : pts > 0 ? 'hit-1' : '';
          return `<td class="${cls}"><span class="score-disp">${pH}-${pA}</span>${pts > 0 ? `<br><span class="pts-badge">+${pts}</span>` : ''}</td>`;
        }).join('')}
      </tr>`;
    });
  });

  document.getElementById('pron-table').innerHTML = heads + '<tbody>' + rows + '</tbody>';
}

// Init
renderRanking();
renderResultados();
</script>
</body>
</html>
